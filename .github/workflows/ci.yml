name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
  checks: write
  statuses: write
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=success -f context=lab-status
      - run: if [ -e ci-neutral.txt ]; then gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" -f name=lab-neutral -f head_sha="$SHA" -f status=completed -f conclusion=neutral; fi
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - run: test ! -e ci-must-fail.txt
